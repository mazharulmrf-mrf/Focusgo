name: Build Android APK

# কবে চলবে:
# 1) main ব্রাঞ্চে কোনো push হলে (তুমি GitHub অ্যাপ/ওয়েব থেকে ফাইল এডিট করে commit করলেই এটা ট্রিগার হবে)
# 2) অথবা GitHub-এর Actions ট্যাব থেকে ম্যানুয়ালি "Run workflow" চাপলে
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: রিপো checkout করা
        uses: actions/checkout@v4

      - name: Node.js সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: প্রজেক্টের সব npm dependency ইনস্টল
        run: npm install

      # এই লাইনটাই মূল কাজ করছে — তোমার package.json-এ ম্যানুয়ালি কিছু এডিট করতে হবে না,
      # প্রতিবার বিল্ডের সময় এই প্লাগইনটা এখান থেকেই ইনস্টল হয়ে যাবে
      - name: Local Notifications প্লাগইন ইনস্টল
        run: npm install @capacitor/local-notifications --save

      - name: Java (JDK) সেটআপ — Android বিল্ডের জন্য দরকার
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # তোমার প্রজেক্টে build script-এর নাম আলাদা হলে (যেমন vite হলে) এই লাইনটা বদলাতে হতে পারে
      - name: ওয়েব অ্যাসেট বিল্ড করা
        run: npm run build

      - name: Capacitor Android সিঙ্ক
        run: npx cap sync android

      - name: gradlew-কে এক্সিকিউটেবল বানানো
        run: chmod +x android/gradlew

      - name: APK বিল্ড করা (debug)
        run: cd android && ./gradlew assembleDebug

      # ZIP artifact না দিয়ে সরাসরি একটা GitHub Release-এ .apk ফাইলটা অ্যাটাচ করে দেওয়া হচ্ছে,
      # যাতে ফোন থেকে সরাসরি .apk ডাউনলোড করা যায় — zip extract করার ঝামেলা নেই
      - name: GitHub Release-এ APK আপলোড
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
