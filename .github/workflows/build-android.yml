name: Build FocusGo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # package.json-এ আগে থেকে save করা না থাকলেও, প্রতিবার এই লাইনটা নিশ্চিত করে দেয়
      # যে @capacitor/local-notifications ইনস্টল হয়ে আছে — নাহলে notification-related
      # import (App.jsx-এ LocalNotifications) না পেয়ে বিল্ড পুরোপুরি fail করতে পারে।
      - name: Ensure Local Notifications plugin is installed
        run: npm install @capacitor/local-notifications --save

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Add Android permissions
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add google-services.json
        run: cp android-keystore/google-services.json android/app/google-services.json

      - name: Apply Google Services Gradle plugin
        run: |
          sed -i "/dependencies {/a\\    classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use stable debug keystore
        run: |
          mkdir -p ~/.android
          cp android-keystore/debug.keystore ~/.android/debug.keystore

      - name: Print debug keystore SHA-1
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusGo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
